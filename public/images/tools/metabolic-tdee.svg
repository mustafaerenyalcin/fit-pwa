<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="gMet" cx="70%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#ff4d1c" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#f5c451" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#090d16"/>
  <rect width="800" height="500" fill="url(#gMet)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Metabolic Calorimeter Concentric Macro Rings (Protein / Carb / Fat + Thermal Core) -->
  <g transform="translate(560, 250)" fill="none">
    <circle cx="0" cy="0" r="168" stroke="#ffffff" stroke-opacity="0.07" stroke-width="12"/>
    <circle cx="0" cy="0" r="168" stroke="#ff4d1c" stroke-opacity="0.78" stroke-width="12" stroke-linecap="round" stroke-dasharray="580 1055" transform="rotate(-110)"/>
    <circle cx="0" cy="0" r="134" stroke="#ffffff" stroke-opacity="0.06" stroke-width="10"/>
    <circle cx="0" cy="0" r="134" stroke="#10b981" stroke-opacity="0.72" stroke-width="10" stroke-linecap="round" stroke-dasharray="470 842" transform="rotate(15)"/>
    <circle cx="0" cy="0" r="100" stroke="#ffffff" stroke-opacity="0.05" stroke-width="8"/>
    <circle cx="0" cy="0" r="100" stroke="#f5c451" stroke-opacity="0.72" stroke-width="8" stroke-linecap="round" stroke-dasharray="280 628" transform="rotate(140)"/>

    <!-- Central Flame / Metabolic Spark Icon -->
    <path d="M 2 -52 C 26 -24, 42 4, 24 34 C 12 52, -16 52, -26 32 C -38 8, -22 -14, -10 -22 C -12 -6, -4 2, 4 -8 C 12 -18, 8 -34, 2 -52 Z"
          fill="#ff4d1c" fill-opacity="0.28" stroke="#ff6b35" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
