<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="gTab" cx="72%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#00f0ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080d14" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#080d14"/>
  <rect width="800" height="500" fill="url(#gTab)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Interval Equalizer Bars (8 Rounds Tabata Signature) -->
  <g opacity="0.45">
    <rect x="400" y="340" width="14" height="56" rx="7" fill="#10b981"/>
    <rect x="424" y="310" width="14" height="86" rx="7" fill="#10b981"/>
    <rect x="448" y="278" width="14" height="118" rx="7" fill="#34d399"/>
    <rect x="472" y="242" width="14" height="154" rx="7" fill="#00f0ff"/>
    <rect x="496" y="294" width="14" height="102" rx="7" fill="#10b981"/>
    <rect x="520" y="256" width="14" height="140" rx="7" fill="#34d399"/>
    <rect x="544" y="220" width="14" height="176" rx="7" fill="#00f0ff"/>
    <rect x="568" y="318" width="14" height="78" rx="7" fill="#10b981"/>
  </g>

  <!-- Dual Concentric Chronometer Rings -->
  <g transform="translate(565, 225)" fill="none">
    <circle cx="0" cy="0" r="158" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10"/>
    <circle cx="0" cy="0" r="158" stroke="#10b981" stroke-opacity="0.72" stroke-width="10" stroke-linecap="round" stroke-dasharray="680 993" transform="rotate(-90)"/>
    <circle cx="0" cy="0" r="126" stroke="#ffffff" stroke-opacity="0.06" stroke-width="6"/>
    <circle cx="0" cy="0" r="126" stroke="#00f0ff" stroke-opacity="0.62" stroke-width="6" stroke-linecap="round" stroke-dasharray="460 792" transform="rotate(20)"/>
    <!-- Tick marks around bezel -->
    <circle cx="0" cy="0" r="178" stroke="#10b981" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="3 15"/>
    <!-- Stopwatch crown & hand -->
    <line x1="0" y1="0" x2="72" y2="-68" stroke="#34d399" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="9" fill="#10b981"/>
  </g>
</svg>
