<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="gForm" cx="68%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#090d16"/>
  <rect width="800" height="500" fill="url(#gForm)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Biomechanical Barbell Squat Side-Profile Skeletal Kinematic Tracking -->
  <g transform="translate(550, 255)" fill="none">
    <!-- Viewfinder corner brackets -->
    <path d="M -175 -125 L -175 -165 L -135 -165" stroke="#00f0ff" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M 175 -125 L 175 -165 L 135 -165" stroke="#00f0ff" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M -175 125 L -175 165 L -135 165" stroke="#00f0ff" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M 175 125 L 175 165 L 135 165" stroke="#00f0ff" stroke-opacity="0.45" stroke-width="3"/>

    <!-- Vertical Barbell Path Line & Floor Plane -->
    <line x1="16" y1="-145" x2="16" y2="145" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="6 6"/>
    <line x1="-130" y1="142" x2="130" y2="142" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Kinematic Squat Skeleton: Shoulder -> Hip -> Knee -> Ankle -->
    <path d="M 16 -82 L -72 28 L 32 34 L -16 140" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Head & Barbell End Plate -->
    <circle cx="42" cy="-110" r="18" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
    <circle cx="16" cy="-82" r="24" fill="#00f0ff" fill-opacity="0.16" stroke="#ff4d1c" stroke-width="3"/>

    <!-- Angle Arcs at Hip and Knee -->
    <path d="M -42 -10 A 48 48 0 0 1 -24 31" stroke="#10b981" stroke-width="3"/>
    <path d="M -12 31 A 44 44 0 0 1 12 72" stroke="#f5c451" stroke-width="3"/>

    <!-- Tracked Joint Nodes -->
    <circle cx="16" cy="-82" r="7" fill="#ffffff"/>
    <circle cx="-72" cy="28" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <circle cx="32" cy="34" r="9" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-16" cy="140" r="7" fill="#ffffff"/>
  </g>
</svg>
