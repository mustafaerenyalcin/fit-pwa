<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="gGen" cx="68%" cy="48%" r="56%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#10b981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#090d16"/>
  <rect width="800" height="500" fill="url(#gGen)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Vitruvian Proportion Circle/Square + DNA Double Helix -->
  <g transform="translate(555, 250)" fill="none">
    <circle cx="0" cy="0" r="172" stroke="#00f0ff" stroke-opacity="0.24" stroke-width="1.5"/>
    <rect x="-132" y="-132" width="264" height="264" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

    <!-- DNA Double Helix Vertical Axis -->
    <g transform="rotate(-18)">
      <path d="M -38 -155 C 38 -105, -38 -50, 38 0 C -38 50, 38 105, -38 155" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 38 -155 C -38 -105, 38 -50, -38 0 C 38 50, -38 105, 38 155" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Base pair rungs -->
      <g stroke="#e2e8f0" stroke-opacity="0.55" stroke-width="2">
        <line x1="-26" y1="-126" x2="26" y2="-126"/>
        <line x1="-30" y1="-82" x2="30" y2="-82"/>
        <line x1="-24" y1="-38" x2="24" y2="-38"/>
        <line x1="-24" y1="38" x2="24" y2="38"/>
        <line x1="-30" y1="82" x2="30" y2="82"/>
        <line x1="-26" y1="126" x2="26" y2="126"/>
      </g>
    </g>
  </g>
</svg>
