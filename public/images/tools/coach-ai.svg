<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="gCoach" cx="70%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="1"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="#090d16"/>
  <rect width="800" height="500" fill="url(#gCoach)"/>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Neural Adaptive Coach Core Network -->
  <g transform="translate(560, 250)" fill="none">
    <circle cx="0" cy="0" r="150" stroke="#a855f7" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="95" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Radial neural spokes -->
    <g stroke="#c084fc" stroke-opacity="0.45" stroke-width="1.8">
      <line x1="0" y1="0" x2="105" y2="-85"/>
      <line x1="0" y1="0" x2="128" y2="25"/>
      <line x1="0" y1="0" x2="68" y2="115"/>
      <line x1="0" y1="0" x2="-92" y2="88"/>
      <line x1="0" y1="0" x2="-116" y2="-42"/>
      <line x1="0" y1="0" x2="-22" y2="-122"/>
    </g>

    <!-- Satellite nodes -->
    <circle cx="105" cy="-85" r="8" fill="#00f0ff"/>
    <circle cx="128" cy="25" r="7" fill="#c084fc"/>
    <circle cx="68" cy="115" r="8" fill="#10b981"/>
    <circle cx="-92" cy="88" r="7" fill="#c084fc"/>
    <circle cx="-116" cy="-42" r="8" fill="#00f0ff"/>
    <circle cx="-22" cy="-122" r="7" fill="#c084fc"/>

    <!-- Central AI Core Spark -->
    <circle cx="0" cy="0" r="34" fill="#090d16" stroke="#c084fc" stroke-width="2.5"/>
    <path d="M 0 -17 L 5 -5 L 17 0 L 5 5 L 0 17 L -5 5 L -17 0 L -5 -5 Z" fill="#00f0ff"/>
  </g>
</svg>
